spring.application.name=registration

# Update these values to match your local PostgreSQL setup.
spring.datasource.url=jdbc:postgresql://localhost:5432/registration_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD

# For this learning project only; creates/updates the users table.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
